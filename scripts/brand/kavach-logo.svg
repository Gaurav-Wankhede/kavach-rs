<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Kavach logo">
  <title>Kavach</title>
  <desc>Steel shield with an accent-blue checkmark. Kavach (कवच) = shield/armor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C202B"/>
      <stop offset="1" stop-color="#11141B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDD3DF"/>
      <stop offset="1" stop-color="#AAB2C2"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA3B6"/>
      <stop offset="1" stop-color="#343945"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3B"/>
      <stop offset="1" stop-color="#181B23"/>
    </linearGradient>
  </defs>

  <!-- app-icon backdrop (omit this rect for the transparent README/favicon mark) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- silver beveled rim -->
  <polygon points="214,214 810,214 826,590 512,845 198,590"
           fill="url(#rim)"/>
  <!-- gunmetal body plate -->
  <polygon points="230,230 794,230 806,579 512,824 218,579"
           fill="url(#body)"/>
  <!-- recessed inner panel -->
  <polygon points="289,287 735,287 745,543 512,763 279,543"
           fill="url(#panel)"/>

  <!-- accent-blue checkmark -->
  <polyline points="374,507 491,614 681,405"
            fill="none" stroke="#4F8CFF" stroke-width="53"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="374,507 491,614 681,405"
            fill="none" stroke="#7CAAFF" stroke-width="12"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.55"
            transform="translate(0,-14)"/>
</svg>

[profile.release]
strip = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
aho-corasick = "1"
ast-grep-core = "0.50"
ast-grep-config = "0.50"
ast-grep-language = "0.50"
ast-grep-outline = "0.50"
blake3 = "1"
bon = "3"
color-eyre = "0.6"
dashmap = "6"
dirs = "7"
fs2 = "0.4"
futures = "0.3"
glob-match = "0.2"
http = "1"
ignore = "0.4"
itertools = "0.15"
maud = "0.27"
native-tls = "0.2"
parking_lot = "0.12"
postgres = "0.19"
postgres-native-tls = "0.5"
proptest = "1.5"
pulldown-cmark = "0.13"
regex = "1"
scraper = "0.27"
serde_json = "1"
serde_yaml = "0.9"
smart-default = "0.7"
subtle = "2"
svg = "0.18"
temp-env = "0.3"
sqlparser = "0.54"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"

[workspace.dependencies.axum]
features = ["macros"]
version = "0.8"

[workspace.dependencies.chrono]
features = ["serde"]
version = "0.4"

[workspace.dependencies.clap]
features = ["derive"]
version = "4.6"

[workspace.dependencies.gix]
default-features = false
features = [
    "status",
    "blob-diff",
    "revision",
    "index",
    "sha1",
]
version = "0.89"

[workspace.dependencies.indexmap]
features = ["serde"]
version = "2"

[workspace.dependencies.insta]
features = ["json"]
version = "1.40"

[workspace.dependencies.jsonrpsee]
features = [
    "server",
    "macros",
]
version = "0.26"

[workspace.dependencies.kavach-toon]
path = "crates/kavach-toon"

[workspace.dependencies.miette]
features = ["fancy"]
version = "7"

[workspace.dependencies.rhai]
default-features = false
features = [
    "sync",
    "serde",
]
version = "1.19.0"

[workspace.dependencies.serde]
features = ["derive"]
version = "1"

[workspace.dependencies.similar]
default-features = false
features = ["text"]
version = "3.2"

[workspace.dependencies.strum]
features = ["derive"]
version = "0.28"

[workspace.dependencies.tokio]
features = [
    "rt-multi-thread",
    "macros",
    "io-std",
    "io-util",
    "signal",
    "net",
]
version = "1"

[workspace.dependencies.tokio-util]
features = ["rt"]
version = "0.7"

[workspace.dependencies.tower]
features = ["util"]
version = "0.4"

[workspace.dependencies.tower-http]
features = [
    "fs",
    "cors",
    "validate-request",
    "limit",
]
version = "0.7"

[workspace.dependencies.tracing-subscriber]
features = ["env-filter"]
version = "0.3"

[workspace.dependencies.ureq]
features = ["json"]
version = "3"

[workspace.lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
assertions_on_constants = "deny"
blanket_clippy_restriction_lints = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
doc_markdown = "allow"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
exit = "deny"
expect_used = "deny"
field_reassign_with_default = "allow"
filetype_is_file = "deny"
float_arithmetic = "deny"
get_unwrap = "deny"
if_then_some_else_none = "deny"
implicit_clone = "deny"
indexing_slicing = "deny"
inefficient_to_string = "deny"
infinite_loop = "deny"
integer_division = "deny"
large_include_file = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
let_underscore_future = "deny"
let_underscore_lock = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
manual_let_else = "deny"
map_err_ignore = "deny"
match_wild_err_arm = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
multiple_inherent_impl = "deny"
multiple_unsafe_ops_per_block = "deny"
mut_mut = "deny"
mutex_atomic = "deny"
needless_pass_by_value = "deny"
panic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_clone = "deny"
ref_as_ptr = "deny"
rest_pat_in_fully_bound_structs = "deny"
same_name_method = "deny"
self_named_module_files = "allow"
semicolon_inside_block = "deny"
shadow_unrelated = "deny"
str_split_at_newline = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unnecessary_self_imports = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"

[workspace.lints.clippy.complexity]
level = "deny"
priority = -1

[workspace.lints.clippy.correctness]
level = "deny"
priority = -1

[workspace.lints.clippy.nursery]
level = "warn"
priority = -1

[workspace.lints.clippy.pedantic]
level = "deny"
priority = -1

[workspace.lints.clippy.perf]
level = "deny"
priority = -1

[workspace.lints.clippy.style]
level = "deny"
priority = -1

[workspace.lints.clippy.suspicious]
level = "deny"
priority = -1

[workspace.lints.rust]
dead_code = "deny"
deprecated_in_future = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "forbid"
single_use_lifetimes = "warn"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_imports = "deny"
unused_lifetimes = "deny"
unused_must_use = "deny"
unused_qualifications = "deny"
unused_variables = "deny"

[workspace.lints.rust.future_incompatible]
level = "deny"
priority = -1

[workspace.lints.rust.nonstandard_style]
level = "deny"
priority = -1

[workspace.lints.rust.rust_2018_idioms]
level = "deny"
priority = -1

[workspace.lints.rust.rust_2021_compatibility]
level = "deny"
priority = -1

[workspace.lints.rust.unused]
level = "deny"
priority = -1

[workspace.package]
authors = ["Gaurav-Wankhede <gauravanilwankhede2002@gmail.com>"]
edition = "2024"
homepage = "https://github.com/Gaurav-Wankhede/kavach-rs"
license = "MIT"
publish = false
repository = "https://github.com/Gaurav-Wankhede/kavach-rs"
rust-version = "1.95.0"
version = "1.3.5"

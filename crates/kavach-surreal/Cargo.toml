[package]
name = "kavach-surreal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bon = { workspace = true }
itertools = { workspace = true }
surrealdb = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
surrealdb-types = "3.1.4"
# load-dynamic (not download-binaries): ort loads libonnxruntime at RUNTIME, so
# the build/link step needs no static lib. Fixes CI test-compile on Linux/Windows
# where the download strategy failed to surface the `-L` path under
# `cargo test --no-run` ("could not find native static library onnxruntime").
# fastembed still fetches the runtime + model into its cache on first init.
# SOURCE: https://ort.pyke.io/setup/linking (load-dynamic recommended).
fastembed = { version = "4", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
blake3 = { workspace = true }
kavach-types = { path = "../kavach-types" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true

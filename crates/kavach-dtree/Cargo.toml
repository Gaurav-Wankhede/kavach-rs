[package]
name = "kavach-dtree"
version = "0.1.0"
edition = "2024"
description = "Decision tree classifier for intent routing and gate decisions"
# Inherit publish=false from [workspace.package] so cargo-deny's
# licenses.private.ignore correctly recognizes this as a workspace-
# internal crate (was being flagged as unlicensed before this line).
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]

[lints]
workspace = true

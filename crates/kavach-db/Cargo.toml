[package]
name = "kavach-db"
version = "1.1.0"
edition = "2024"
publish = false

[dependencies]
bon = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
libsql = { version = "0.9", default-features = false, features = ["core"] }
blake3 = { workspace = true }
kavach-types = { path = "../kavach-types" }
fastembed = { version = "6.0.2", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
tree-sitter = { version = "0.27.0", default-features = false }
tree-sitter-rust = { version = "0.24.2", default-features = false }
tree-sitter-python = { version = "0.25.0", default-features = false }
tree-sitter-typescript = { version = "0.23.2", default-features = false }
tree-sitter-javascript = { version = "0.23.1", default-features = false }
# tree-sitter-markdown = { version = "0.7", default-features = false }  # incompatible with tree-sitter 0.27
tree-sitter-markdown-fork = { version = "0.7.3", default-features = false }
tree-sitter-yaml = { version = "0.7", default-features = false }
# tree-sitter-toml = { version = "0.20", default-features = false }  # incompatible with tree-sitter 0.27
tree-sitter-toml-ng = { version = "0.7", default-features = false }
tree-sitter-json = { version = "0.24.8", default-features = false }
tree-sitter-bash = { version = "0.25", default-features = false }
tree-sitter-sql = { version = "0.0", default-features = false }  # placeholder, using tree-sitter-sequel instead
tree-sitter-sequel = { version = "0.3", default-features = false }
ast-grep-core = { version = "0.45.3", default-features = false, features = ["tree-sitter"] }
tempfile = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true
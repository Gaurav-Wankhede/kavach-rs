[package]
name = "kavach-db"
version = "1.0.1"
edition = "2024"
publish = false

[dependencies]
bon = { workspace = true }
itertools = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
libsql = { version = "0.9", default-features = false, features = ["core"] }
blake3 = { workspace = true }
kavach-types = { path = "../kavach-types" }
fastembed = { version = "6.0.2", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true

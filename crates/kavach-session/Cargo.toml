[package]
name = "kavach-session"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
# Exposes `paths::set_test_state_dir` to downstream crates so their tests can
# redirect the spool/state dir to a temp path (engine spool-glue tests).
test-support = []

[dependencies]
kavach-config = { path = "../kavach-config" }
kavach-rpc = { path = "../kavach-rpc" }
kavach-surreal = { path = "../kavach-surreal" }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
tracing = { workspace = true }

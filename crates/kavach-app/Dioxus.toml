# Dioxus 0.7 bundle config for the Kavach desktop GUI.
# SOURCE: https://dioxuslabs.com/learn/0.7/guides/tools/configure/
# SOURCE: https://dioxuslabs.com/learn/0.7/tutorial/bundle/
#
# `dx bundle --platform desktop --package-types <type>` produces, per the
# crate name (kavach-app -> KavachApp), under target/dx/kavach-app/bundle/:
#   macOS:   .../macos/macos/KavachApp.app  +  .../macos/macos/KavachApp_<ver>_<arch>.dmg
#   Linux:   .../linux/<type>/...            (deb -> /usr/bin on install)
#   Windows: .../windows/<type>/...          (msi -> C:\Program Files\KavachApp)
# Empirically verified against dx 0.7.7 (single macos/macos, not the older
# docs' doubly-nested bundle/macos/bundle/macos). SOURCE: dx bundle run, 2026-05.
#
# The `kavach` CLI is embedded via `external_bin`. The bundler auto-appends the
# target triple, so it looks for a staged file
#   bin/kavach-<target-triple>   (e.g. bin/kavach-aarch64-apple-darwin)
# relative to this crate root, and strips the suffix back to `kavach` inside
# the bundle. `kavach deploy --bundle` and the release CI stage that file
# before invoking `dx bundle`. On macOS the embedded CLI lands at
# KavachApp.app/Contents/MacOS/kavach.

[application]
name = "Kavach"

[bundle]
identifier = "com.ironwill.kavach"
publisher = "Iron Will International"
icon = ["assets/icon.png"]
# Embed the kavach CLI binary inside the .app. The triple suffix is added
# automatically by the bundler — stage bin/kavach-<triple> before bundling.
external_bin = ["bin/kavach"]

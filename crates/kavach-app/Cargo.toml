[package]
name = "kavach-app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "kavach-app"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
kavach-rpc = { path = "../kavach-rpc" }
kavach-types = { path = "../kavach-types" }
dioxus = { workspace = true }
# rt only: the blocking sync RPC client (change.wait long-poll) must run off
# the Dioxus reactor thread via spawn_blocking so the UI never stalls.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
rustix = { version = "1.1", features = ["process"] }

[lints]
workspace = true

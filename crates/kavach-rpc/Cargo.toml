[package]
name = "kavach-rpc"
version = "0.1.0"
edition = "2024"
publish = false

# Library-only crate. The RPC coordinator is invoked via the single
# `kavach` binary's `rpc` subcommand (kavach-cli/src/cmd/rpc.rs →
# kavach_rpc::run). A standalone [[bin]] used to exist here but produced a
# duplicate binary that drifted from the CLI on deploy (CLI/daemon version
# skew). One binary, one deployed file. SOURCE: rocksdb#908/#1780 — the
# DB coordinator must be a single process, but need not be a second binary.

[dependencies]
kavach-surreal = { path = "../kavach-surreal" }
kavach-patterns = { path = "../kavach-patterns" }
kavach-types = { path = "../kavach-types" }
surrealdb = { workspace = true }
surrealdb-types = { workspace = true }
jsonrpsee = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
rustix = { version = "1.1", features = ["process"] }
dirs = { workspace = true }

[lints]
workspace = true

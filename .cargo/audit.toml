# cargo-audit configuration for kavach-rs.
# The BOUNTY_CVE stop-gate reads `cargo audit`'s denied set; entries here move a
# CVE into the ALLOWED set so it no longer blocks. Each ignore MUST carry a
# disposition: dep path, reachability analysis, impact, and a REVISIT trigger.

# REMOVED: RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack). Its entire justification
# was the chain `rsa -> jsonwebtoken -> surrealdb-core -> surrealdb`, and its own
# REVISIT trigger said to drop the ignore "the moment `cargo tree -i rsa@0.9.10`
# goes empty". It is empty — surrealdb is gone from the tree (Turso/libSQL is the
# engine now) and `cargo tree -i rsa --target all` resolves no package at all.
# Keeping a CVE suppression whose stated cause no longer exists is worse than the
# CVE: it silently tolerates any FUTURE reintroduction of the vulnerable chain.

[advisories]
ignore = [
    # (empty — no accepted advisories. Add an entry only with a paired decision
    #  row naming the dep path, reachability, impact and a REVISIT trigger.)
]

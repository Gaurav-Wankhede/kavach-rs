name: self-heal

# H2 — reactive self-heal trigger (Kavach replaces N8N's webhook→orchestrator).
# When the `build` workflow CONCLUDES IN FAILURE, this workflow gathers the
# failed-step logs (non-AI context only) and enqueues ONE durable incident as a
# `self-heal`-labelled GitHub Issue. The dev host's autonomous loop ingests that
# issue, runs `kavach heal capture` locally (writing the roadmap card via the RPC
# single-writer path), and the SUBSCRIPTION native agent does the fix.
#
# WHY an Issue, not a direct `kavach heal capture` here: the Kavach durable store
# is the host's local SurrealDB daemon — UNREACHABLE from a GitHub runner. The
# Issue is the host-reachable, GitHub-native incident queue. This workflow runs
# ONLY `gh` (non-AI); it NEVER invokes an LLM — the subscription-only constraint
# holds end to end.
#
# `workflow_run` is the only event that can read a finished run's logs (logs are
# downloadable just on completion), so the trigger must live in a SEPARATE
# workflow keyed on the upstream run. SOURCE:
# https://docs.github.com/en/actions/how-tos/monitor-workflows/use-workflow-run-logs
# https://cli.github.com/manual/gh_run_view  (`--log-failed`)

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

# Least privilege: read the failed run's logs, open/label the incident issue.
permissions:
  contents: read
  actions: read
  issues: write

jobs:
  enqueue-incident:
    name: Enqueue self-heal incident (on build failure)
    # Boundary loophole: heal ONLY genuine failures — a green / cancelled /
    # skipped upstream run enqueues nothing.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      # Checkout the EXACT commit that failed, so the heal agent reasons about the
      # tree that broke — not whatever main has drifted to since.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Non-AI context gathering: the failed-step logs only (not the full archive),
      # bounded so a runaway log can't bloat the issue body.
      - name: Capture failed-step logs
        run: |
          set -uo pipefail
          gh run view "$RUN_ID" --log-failed > heal-log.txt 2>&1 || \
            echo "(could not retrieve --log-failed for run $RUN_ID)" > heal-log.txt
          # Bound to the last 300 lines — enough to root-cause, small enough for
          # an issue body (GitHub caps issues at 65536 chars).
          tail -n 300 heal-log.txt > heal-log.tail.txt
          echo "LOG_LINES=$(wc -l < heal-log.tail.txt)" >> "$GITHUB_ENV"

      # Idempotency / replay loophole: ONE incident per failed run id. A re-run of
      # this workflow for the same RUN_ID UPDATES the existing issue, never opens a
      # duplicate (the run id is embedded in a hidden marker we search on).
      #
      # INJECTION SAFETY: HEAD_BRANCH (and the log text) are attacker-controllable
      # (a branch name / log line may contain `$`, backticks, `;`). They reach this
      # step ONLY as pre-set env vars and are written to the body with `printf` +
      # file assembly — never re-evaluated through an unquoted heredoc or `$(...)`,
      # so a hostile branch name cannot execute. RUN_ID is numeric, but we still
      # never splice raw event text into a `run:` shell expression.
      # SOURCE: https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
      - name: Open or update the self-heal incident issue
        run: |
          set -uo pipefail
          MARKER="<!-- self-heal:run:${RUN_ID} -->"
          SHORT_SHA="${HEAD_SHA:0:8}"
          TITLE="[self-heal] build failed on ${HEAD_BRANCH} @ ${SHORT_SHA} (run ${RUN_ID})"

          # Assemble the body in a file. printf treats values as DATA (no eval);
          # the log tail is appended with cat, fenced as a code block.
          {
            printf '%s\n' "${MARKER}"
            printf '[INCIDENT]\n'
            printf 'id: ci-run-%s\n' "${RUN_ID}"
            printf 'summary: build workflow failed on %s @ %s\n' "${HEAD_BRANCH}" "${SHORT_SHA}"
            printf 'run_url: %s\n' "${RUN_URL}"
            printf 'head_sha: %s\n\n' "${HEAD_SHA}"
            printf '[LOG_TAIL]\n'
            printf '```\n'
            cat heal-log.tail.txt
            printf '\n```\n\n'
            printf '[HEAL_CONTRACT]\n'
            printf 'Host autonomous loop: ingest this issue, then run locally:\n'
            printf '  kavach heal capture --project kavach-rs --incident ci-run-%s \\\n' "${RUN_ID}"
            printf '    --summary "build failed @ %s" --log <saved log> --diff-base %s~1\n' "${SHORT_SHA}" "${HEAD_SHA}"
            printf 'The subscription native agent root-causes + fixes AT THE SOURCE, 3-witness\n'
            printf 'verifies, opens a PR, and the fail-closed auto-merge gate decides the merge.\n'
            printf 'Kavach itself NEVER calls an LLM.\n'
          } > heal-issue-body.md

          # Find an existing open issue carrying this run's marker.
          EXISTING="$(gh issue list --state open --label self-heal --search "${MARKER} in:body" \
            --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${EXISTING:-}" ] && [ "${EXISTING}" != "null" ]; then
            gh issue edit "${EXISTING}" --body-file heal-issue-body.md
            echo "updated existing self-heal issue #${EXISTING} for run ${RUN_ID}"
          else
            gh issue create --title "${TITLE}" --label self-heal --body-file heal-issue-body.md
            echo "opened self-heal issue for run ${RUN_ID}"
          fi

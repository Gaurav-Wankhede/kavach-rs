name: release

# Build per-OS `kavach` CLI binaries and attach them to the GitHub Release when a
# CalVer tag is pushed. Versioning is YY.MM.PATCH (CalVer+SemVer blend,
# JetBrains/Ubuntu style): YY.MM = release calendar month, PATCH = iteration
# within that month. Examples: 26.5.0 (first May-2026 release), 26.5.1, 26.6.0.
# The tag IS the version — CI rewrites the crate version to it before building,
# so `kavach --version` reports the same number.
# Asset names stay version-less (kavach-darwin-arm64.tar.gz …) so the
# `releases/latest/download/<name>` links remain valid across releases.
#
# NOTE: there is NO desktop GUI installer leg. The Dioxus/Tauri app (kavach-app)
# was removed; the UI is now `kavach-web` (Axum + maud, server-rendered HTML),
# launched with `kavach web` — it ships INSIDE the CLI binary, so the single CLI
# artifact per platform is the whole product. Do NOT reintroduce `dx bundle` /
# .dmg / .deb / .msi legs.
on:
  push:
    tags:
      # YY.MM.PATCH — 2-digit year, month, patch. Matches 26.5.0, 26.12.3, …
      - "[0-9][0-9].[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

# Supersede an in-flight release run for the same tag instead of stacking a new
# one beside it — re-tagging the same version cancels the prior run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parse + validate the CalVer tag ONCE, expose it to every downstream job.
  # The tag (e.g. 26.5.0) is the single source of truth for the version.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Derive version from tag
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no tag — fall back to a dev stamp so manual
          # runs still build (they won't publish; the release job needs a tag).
          if [ "$REF_TYPE" != "tag" ]; then
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "manual run — version=0.0.0-dev (no publish)"
            exit 0
          fi
          # Enforce YY.MM.PATCH exactly: 2-digit year, 1-2 digit month 1..12, patch.
          if ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]{2}\.(0?[1-9]|1[0-2])\.[0-9]+$'; then
            echo "ERROR: tag '$REF_NAME' is not YY.MM.PATCH (e.g. 26.5.0, 26.12.3)"
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "release version = $REF_NAME"

  build:
    name: ${{ matrix.asset }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: kavach-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: kavach-linux-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: kavach-darwin-amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: kavach-darwin-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: kavach-windows-amd64.zip
          # Windows ARM64 CLI — native on windows-11-arm (GA). Pure CLI, no WiX/MSI
          # dependency, so it builds cleanly on the ARM runner.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: kavach-windows-arm64.zip
    steps:
      - uses: actions/checkout@v6

      # Channel from rust-toolchain.toml (single source of truth — no hardcoded
      # version that can drift); only the cross-compile target is passed per-leg.
      # The action provides its own build cache (keyed below).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      # Bake the CalVer tag into the CLI version so `kavach --version` reports
      # the release version. Only on a real tag (manual runs keep committed ver).
      - name: Set crate version from tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          perl -i -pe 'if (!$done && /^version\s*=/) { $_ = "version = \"$ENV{VERSION}\"\n"; $done=1 }' crates/kavach-cli/Cargo.toml
          grep -m1 '^version' crates/kavach-cli/Cargo.toml

      # Every target builds NATIVELY on a matching runner (incl. linux-arm64 on
      # GitHub's ubuntu-24.04-arm). No cross/Docker — avoids the cross image's
      # missing libclang/stdbool that broke surrealdb-librocksdb-sys + ring.
      # No GUI system deps: kavach-web is pure-Rust Axum+maud (no wry/webkit2gtk).
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p kavach-cli

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" kavach

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/kavach.exe" `
            -DestinationPath "${{ matrix.asset }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish release
    needs: [version, build]
    # Partial-success publish: ship whatever build legs SUCCEEDED instead of
    # skipping the whole release when one matrix leg is red. `fail-fast: false`
    # lets every healthy leg finish; this job downloads only the artifacts that
    # were actually produced and publishes them. Rationale: an all-green guard
    # meant a single red leg (e.g. Windows) left ALL releases/latest/download
    # URLs 404 — a worse failure than a release missing one of six assets.
    # `!cancelled()` runs regardless of upstream success; the no-assets guard
    # below still refuses to publish an empty release, and softprops uploads only
    # the files the glob matches, so a missing leg simply omits its asset (that
    # URL 404s until the leg is fixed and the tag re-cut). A still-running
    # upstream (cancelled) is excluded so we never publish a truncated set.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Fail closed: if NO build leg produced an asset, there is nothing to
      # release — abort rather than cut an empty (assetless) release.
      - name: Require at least one asset
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -type f -name 'kavach-*' | wc -l | tr -d ' ')
          echo "downloaded asset count = $count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no build leg produced an asset — refusing to publish an empty release"
            exit 1
          fi

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # nullglob so a missing leg's pattern expands to nothing instead of a
          # literal 'kavach-*' filename — partial sets must still checksum cleanly.
          shopt -s nullglob
          files=(kavach-*)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          # Display the CalVer version (YY.MM.PATCH) as the release title.
          name: Kavach ${{ needs.version.outputs.version }}
          # Globs match only files that actually downloaded — a failed leg's
          # asset is simply absent, not an upload error.
          files: |
            dist/kavach-*
            dist/SHA256SUMS.txt

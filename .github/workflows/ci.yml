name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every gate below runs through `just`, so CI executes the IDENTICAL recipes a
# developer runs locally (`just fmt`/`lint`/`release`/`test`/`deny`/`unused`).
# The justfile is the SINGLE SOURCE OF TRUTH for every flag — this is what kills
# the CI<->local drift hand-copied cargo lines accrue (the old CI lacked
# --all-features on clippy and --profile ci / doctests on the test run).
# FOOTGUN: `just install` is the DEPLOY recipe (`cargo run --release -p
# kavach-cli -- deploy`); CI installs the just TOOL via taiki-e/install-action
# and must NEVER run `just install`.
#
# COST MODEL (why the structure below):
#  * `just` is a thin wrapper — it adds ~0ms; the cost is the cargo work under it.
#  * setup-rust-toolchain BUNDLES Swatinem/rust-cache (cache: true by default), so
#    ~/.cargo + target/ are cached keyed on Cargo.lock + the toolchain triple. We
#    do NOT add rust-cache separately (it would double-cache). A per-OS
#    `cache-shared-key` keeps the entry stable across this workflow's reruns.
#  * The three profiles (clippy=dev+all-features, release, nextest=test) each
#    recompile the workspace, so building all three triples the work. On PRs we
#    run clippy + test only (they already PROVE it compiles); the release build
#    runs only on push-to-main, where the artifact actually matters.
#  * macOS/Windows minutes cost ~10x/2x Linux. Every PR runs the full Linux leg
#    (fast feedback); macOS + Windows run on push-to-main + manual dispatch only.
#    Windows must stay green there — roadmap publish-first-release gates on it.

jobs:
  # ── Linux (every PR + push — the fast feedback leg) ──────────────────────────
  linux:
    name: Build / Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No GUI system deps needed: the Dioxus/Tauri desktop app (kavach-app) was
      # removed. The web UI is now `kavach-web` (Axum + maud, server-rendered HTML)
      # — pure Rust, no wry/webkit2gtk/glib, so the whole workspace builds with
      # only the stock runner + OpenSSL (vendored where required). If a leaf crate
      # ever needs a system lib, add it here; do NOT reintroduce the GTK/WebKit set.

      # No `toolchain:` input → the action reads the channel + components from
      # rust-toolchain.toml, making that file the SINGLE source of truth. The
      # prior hardcoded "1.95.0" diverged from the repo's pinned 1.96.0, so CI ran
      # a different rustfmt than the tree was formatted with and `fmt --check`
      # failed on every push. (https://github.com/actions-rust-lang/setup-rust-toolchain)
      # The action's BUILT-IN Swatinem/rust-cache is on by default; the shared key
      # keeps the target/ + ~/.cargo cache stable across reruns of this leg.
      - name: Install Rust toolchain + cache (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci-linux

      # Install the `just` runner + cargo-nextest (the justfile `test` recipe
      # shells out to `cargo nextest`, so the binary must exist on the runner).
      # taiki-e/install-action pulls prebuilt binaries (~seconds) and already is
      # the repo's nextest installer — one trusted provider for both tools.
      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Gate commands + flags are the single source of truth in ./justfile.
      - name: Format check (just fmt)
        run: just fmt

      - name: Clippy (just lint)
        run: just lint

      # Release build runs only on push-to-main / manual dispatch: on PRs, clippy
      # + nextest already prove the workspace compiles, so a third full recompile
      # in the release profile is pure wasted minutes. push-to-main keeps it for
      # parity with the release pipeline and to catch release-only build breaks.
      - name: Build release (just release)
        if: github.event_name != 'pull_request'
        run: just release

      - name: Test (just test — nextest ci profile + doctests)
        run: just test

  # ── Cross-platform compile gate (macOS + Windows — runs on EVERY PR + push) ──
  # The Linux leg above is the full build+test; the heavy macOS/Windows full-test
  # legs stay push-only (10x/2x runner cost). But Kavach targets all three OSes
  # and has real per-OS code paths (cfg!(windows) branches, path separators, the
  # per-OS default_db_path in kavach-surreal), so a Linux-only PR can merge an
  # OS-specific BREAK that only surfaces post-merge. This cheap leg closes that
  # gap: `just lint` is `cargo clippy --all-targets --all-features -D warnings`,
  # which COMPILES the whole workspace on each OS (catching cfg/path/dep breaks)
  # WITHOUT the nextest + release recompile the full legs pay. Compile-only, so
  # the PR cost is a fraction of a full macOS/Windows leg.
  cross-check:
    name: Cross-compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + cache (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci-cross-${{ matrix.os }}

      - name: Install just
        uses: taiki-e/install-action@just

      # The justfile pins `set shell := ["bash", "-uc"]`; on the Windows runner
      # that resolves to the Git Bash on the image. Fail fast with a clear message
      # if a future image ever drops bash, instead of an opaque recipe error.
      - name: Verify bash is available (just recipes require it)
        shell: bash
        run: bash --version

      # Clippy compiles the whole workspace on this OS, so a cfg!()-gated or
      # path-separator break that builds on Linux is caught here pre-merge. No
      # `just test`/`just release` — full test coverage stays on the push-only legs.
      - name: Clippy (just lint — cross-platform compile gate)
        run: just lint

  # ── Policy (Linux only — OS-independent gates, run ONCE) ─────────────────────
  # Routes the supply-chain + hygiene gates through `just` too, so the WHOLE
  # pipeline is single-source: `just deny` (advisories + bans + licenses +
  # sources, mirrors deploy.rs step 3) and `just unused` (cargo-machete
  # dead-dependency scan — a gate the old CI lacked, so an unused workspace dep
  # that fails local `just ci` used to pass CI green). Both are manifest/lockfile
  # scans, identical on every OS, so they run a single time here rather than
  # triplicated across the build legs.
  policy:
    name: Policy (cargo-deny + machete via just)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # cargo-deny + cargo-machete invoke `cargo metadata`, so a toolchain is
      # required even though neither compiles the tree.
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci-policy

      - name: Install just + cargo-deny + cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete

      - name: Supply-chain policy (just deny)
        run: just deny

      - name: Unused dependencies (just unused)
        run: just unused

  # ── macOS (push-to-main + manual dispatch only — 10x runner cost) ────────────
  macos:
    name: Build / Test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # `toolchain:` omitted on purpose — the action reads rust-toolchain.toml
      # (single source of truth) and provides its own built-in build cache.
      - name: Install Rust toolchain + cache (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci-macos

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format check (just fmt)
        run: just fmt

      - name: Clippy (just lint)
        run: just lint

      - name: Build release (just release)
        run: just release

      - name: Test (just test — nextest ci profile + doctests)
        run: just test

  # ── Windows (push-to-main + manual dispatch only) ────────────────────────────
  # Must stay green on main: roadmap publish-first-release is BLOCKED on Windows
  # CI green, so this leg is the release gate — kept off PRs to save minutes but
  # always run on the merge to main that a release tag is later cut from.
  windows:
    name: Build / Test (Windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # `toolchain:` omitted on purpose — the action reads rust-toolchain.toml
      # (single source of truth) and provides its own built-in build cache.
      - name: Install Rust toolchain + cache (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ci-windows

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The justfile pins `set shell := ["bash", "-uc"]`, so the `just` steps below
      # run under Git Bash (present on the windows-latest image). This guard fails
      # fast with a clear message if a future runner image ever drops bash from
      # PATH, instead of an opaque "bash: not found" from the first recipe.
      - name: Verify bash is available (just recipes require it)
        shell: bash
        run: bash --version

      - name: Format check (just fmt)
        run: just fmt

      - name: Clippy (just lint)
        run: just lint

      - name: Build release (just release)
        run: just release

      - name: Test (just test — nextest ci profile + doctests)
        run: just test

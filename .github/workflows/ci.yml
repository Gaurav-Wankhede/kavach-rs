name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    name: Build / Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dioxus desktop app (kavach-app) links wry/webkit2gtk-4.1 + libsoup-3,
      # so glib-sys/webkit2gtk-sys build scripts need the GTK/WebKit dev headers.
      # Without these, `cargo clippy --all-targets` fails compiling glib-sys.
      # Authoritative webkit2gtk-4.1 set per Tauri v2 GitHub pipelines docs
      # (https://v2.tauri.app/distribute/pipelines/github/). wry here uses
      # webkit2gtk-sys 2.0.1 + soup3-sys = the 4.1 / libsoup-3 generation, which
      # is the only one packaged on ubuntu-latest (24.04); 4.0 was dropped there.
      - name: Install Linux GUI system deps (GTK/WebKit for Dioxus desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # No `toolchain:` input → the action reads the channel + components from
      # rust-toolchain.toml, making that file the SINGLE source of truth. The
      # prior hardcoded "1.95.0" diverged from the repo's pinned 1.96.0, so CI ran
      # a different rustfmt than the tree was formatted with and `fmt --check`
      # failed on every push. (https://github.com/actions-rust-lang/setup-rust-toolchain)
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

      # The repo's test contract is `cargo nextest run --workspace` (CLAUDE.md +
      # .config/nextest.toml), with per-test process isolation. Without this step
      # CI proved only that the tree COMPILES — every unit/integration test
      # (e.g. the multi-harness cursor/codex output contracts) was unverified.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test (nextest, workspace)
        run: cargo nextest run --workspace

      - name: Install global CLAUDE.md (derives path from $HOME, no hardcoding)
        run: bash scripts/install-claude-md.sh

      - name: Verify global CLAUDE.md landed
        run: |
          test -f "$HOME/.claude/CLAUDE.md"
          echo "OK: $HOME/.claude/CLAUDE.md"

  # ── Supply chain (Linux only — advisories/bans/licenses/sources) ─────────────
  # Mirrors deploy.rs step 3 (`cargo deny check`). A banned advisory, denied
  # license, or unvetted source must fail the PR, not just the local deploy.
  supply-chain:
    name: cargo-deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: Build / Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # `toolchain:` omitted on purpose — the action reads rust-toolchain.toml
      # (single source of truth) and provides its own build cache.
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test (nextest, workspace)
        run: cargo nextest run --workspace

      - name: Install global CLAUDE.md (derives path from $HOME, no hardcoding)
        run: bash scripts/install-claude-md.sh

      - name: Verify global CLAUDE.md landed
        run: |
          test -f "$HOME/.claude/CLAUDE.md"
          echo "OK: $HOME/.claude/CLAUDE.md"

  # ── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Build / Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # `toolchain:` omitted on purpose — the action reads rust-toolchain.toml
      # (single source of truth) and provides its own build cache.
      - name: Install Rust toolchain (channel from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test (nextest, workspace)
        run: cargo nextest run --workspace

      - name: Install global CLAUDE.md (derives path from %USERPROFILE%, no hardcoding)
        shell: pwsh
        run: ./scripts/install-claude-md.ps1

      - name: Verify global CLAUDE.md landed
        shell: pwsh
        run: |
          $dest = Join-Path $env:USERPROFILE '.claude\CLAUDE.md'
          if (-not (Test-Path $dest)) { throw "missing: $dest" }
          Write-Output "OK: $dest"
